name: Atualizar heatmap do perfil

on:
  schedule:
    # Todo dia ~06:17 UTC (03:17 BRT). Minuto quebrado evita a fila de topo de hora.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar contribuições
        run: python scripts/fetch_contributions.py

      - name: Renderizar heatmap
        run: python scripts/render_heatmap.py

      - name: Commitar se mudou
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza heatmap de contribuições [skip ci]"
          file_pattern: assets/contrib.svg data/contributions.json
