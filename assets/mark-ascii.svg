<svg xmlns="http://www.w3.org/2000/svg" width="356" height="268" viewBox="0 0 356 268" role="img" aria-label="Monograma da Metho em ASCII art">
  <title>Metho — monograma</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#E5001A"/>
      <stop offset=".62" stop-color="#E5001A"/>
      <stop offset="1" stop-color="#8C0303"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5001A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E5001A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#E5001A" stop-opacity=".13"/>
      <stop offset="1" stop-color="#E5001A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5001A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5001A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E5001A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .r { font-size: 5.24px; letter-spacing: 0.000px; fill: url(#ink); white-space: pre; }
    .kicker { font-size: 10px; fill: #E5001A; letter-spacing: .18em; font-weight: 600; }
    .meta { font-size: 10px; fill: #55556A; letter-spacing: .06em; }
    .name { font-size: 11px; fill: #9999AA; letter-spacing: .24em; }
    @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -2% 0 0); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes scan { from { transform: translateY(0); opacity: 0; } 12% { opacity: .8; } to { transform: translateY(197.0px); opacity: 0; } }
    .r { clip-path: inset(0 100% 0 0); animation: wipe .5s cubic-bezier(.33,1,.68,1) both; }
    .meta { opacity: 0; animation: fade-up .5s cubic-bezier(.22,1,.36,1) 1.35s both; }
    .scanline { animation: scan 1.7s cubic-bezier(.4,0,.2,1) .15s both; }

  </style>

  <rect width="356" height="268" rx="14" fill="#141419"/>
  <rect x="39.0" y="44.0" width="278" height="197.0" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="355" height="267" rx="13.5" fill="none" stroke="rgba(255,255,255,0.06)"/>
  <rect x="1" y="0" width="354" height="1.5" fill="url(#edge)"/>

  <text class="kicker" x="20" y="30">MONOGRAMA</text>

